<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay DHRUV PRATAP SINGH via UPI</title>
    <!-- QR Code banane wali reliable library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .upi-id {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #cbd5e1;
            margin: 15px 0;
            user-select: all;
        }
        #qrcode {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            margin: 10px 0;
        }
        #qrcode img {
            margin: auto;
        }
        .btn {
            display: block;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
        }
        .note {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>DHRUV PRATAP SINGH</h1>
    <div class="upi-id">UPI ID: <b>dprxmodzowner@naviaxis</b></div>
    
    <!-- QR code yahan apne aap ban jayega -->
    <div id="qrcode"></div>

    <a href="upi://pay?pa=dprxmodzowner@naviaxis&pn=DHRUV%20PRATAP%20SINGH&cu=INR" class="btn">
        Open UPI App to Pay
    </a>

    <div class="note">Choose any UPI app (PhonePe / GPay / Paytm / Navi) when prompted.</div>
</div>

<script>
    // Page load hote hi live QR code generate karega
    new QRCode(document.getElementById("qrcode"), {
        text: "upi://pay?pa=dprxmodzowner@naviaxis&pn=DHRUV%20PRATAP%20SINGH&cu=INR",
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
</script>

</body>
</html>
